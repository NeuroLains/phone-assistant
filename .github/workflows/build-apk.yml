name: Build APK from ZIP

on:
  push:
    paths:
      - phone-assistant-source.zip
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q phone-assistant-source.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix orientation constant
        working-directory: source/phone-assistant
        run: |
          sed -i 's/l.setOrientation(1)/l.setOrientation(LinearLayout.VERTICAL)/' app/src/main/java/ru/neurolains/phoneassistant/MainActivity.java

      - name: Test and build
        working-directory: source/phone-assistant
        run: |
          python3 -m unittest discover -s server -v
          gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAssistant-APK
          path: source/phone-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
